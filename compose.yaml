name: jiawang-commerce

services:
  order-volume-init:
    build: .
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data/uploads && chown -R 1001:1001 /data"]
    restart: "no"
    volumes:
      - order_data:/data

  order-web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/app.db
      UPLOAD_DIR: /data/uploads
      NODE_ENV: production
      SESSION_COOKIE_SECURE: "true"
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      OWNER_PHONE: ${OWNER_PHONE:-13806265100}
      OWNER_PHONE_ALIASES: ${OWNER_PHONE_ALIASES:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?set OWNER_PASSWORD}
      OWNER_NAME: ${OWNER_NAME:-老板}
      SMS_PROVIDER: ${SMS_PROVIDER:-aliyun}
      SMS_PREVIEW_MODE: ${SMS_PREVIEW_MODE:-false}
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      ALIYUN_SMS_REGION_ID: ${ALIYUN_SMS_REGION_ID:-cn-hangzhou}
      INTEGRATION_SHARED_SECRET: ${INTEGRATION_SHARED_SECRET:?set INTEGRATION_SHARED_SECRET}
      WECOM_BOT_WEBHOOK_URL: ${WECOM_BOT_WEBHOOK_URL:-}
      WECOM_BOT_MENTION_MOBILE: ${WECOM_BOT_MENTION_MOBILE:-}
      WAREHOUSE_INTERNAL_URL: http://warehouse-web:3000
    volumes:
      - order_data:/data
    expose: ["3000"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      order-volume-init:
        condition: service_completed_successfully

  order-media-worker:
    build: .
    restart: unless-stopped
    command: ["pnpm", "run", "worker:media"]
    environment:
      DATABASE_URL: file:/data/app.db
      UPLOAD_DIR: /data/uploads
      NODE_ENV: production
      INTEGRATION_SHARED_SECRET: ${INTEGRATION_SHARED_SECRET:?set INTEGRATION_SHARED_SECRET}
      WAREHOUSE_INTERNAL_URL: http://warehouse-web:3000
      MEDIA_WORKER_POLL_MS: ${MEDIA_WORKER_POLL_MS:-30000}
      MEDIA_WORKER_BATCH_SIZE: ${MEDIA_WORKER_BATCH_SIZE:-4}
    volumes:
      - order_data:/data
    security_opt:
      - no-new-privileges:true
    depends_on:
      order-web:
        condition: service_started
      warehouse-web:
        condition: service_healthy
      order-volume-init:
        condition: service_completed_successfully

  warehouse-volume-init:
    build:
      context: ./佳旺仓库系统
      target: web
      args:
        NEXT_PUBLIC_BASE_PATH: /warehouse
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data/db /data/tmp /data/backups /media && chown -R 1000:1000 /data /media"]
    restart: "no"
    volumes: &warehouse_volumes
      - warehouse_data:/data
      - warehouse_media:/media

  warehouse-web:
    build:
      context: ./佳旺仓库系统
      target: web
      args:
        NEXT_PUBLIC_BASE_PATH: /warehouse
    restart: unless-stopped
    environment: &warehouse_environment
      NODE_ENV: production
      NEXT_PUBLIC_BASE_PATH: /warehouse
      DATABASE_PATH: /data/db/app.sqlite
      DATABASE_URL: file:/data/db/app.sqlite
      DATA_DIR: /data
      MEDIA_DIR: /media
      TEMP_DIR: /data/tmp
      TMPDIR: /data/tmp
      BACKUP_OUT_DIR: /data/backups
      PIPELINE_MEDIA_ROOT: /media
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN to the public HTTPS origin}
      REQUIRE_ORIGIN: "true"
      REQUIRE_CSRF: "true"
      APP_MASTER_KEY: ${APP_MASTER_KEY:?set APP_MASTER_KEY}
      INTEGRATION_SHARED_SECRET: ${INTEGRATION_SHARED_SECRET:?set INTEGRATION_SHARED_SECRET}
      ORDER_INTERNAL_URL: http://order-web:3000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      DEEPSEEK_TEXT_MODEL: ${DEEPSEEK_TEXT_MODEL:-}
      DEEPSEEK_VISION_MODEL: ${DEEPSEEK_VISION_MODEL:-}
      DEEPSEEK_ALLOWED_HOSTS: ${DEEPSEEK_ALLOWED_HOSTS:-}
    volumes: *warehouse_volumes
    expose: ["3000"]
    depends_on:
      order-web:
        condition: service_started
      warehouse-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/warehouse/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  warehouse-worker:
    build:
      context: ./佳旺仓库系统
      target: worker
    restart: unless-stopped
    environment: *warehouse_environment
    volumes: *warehouse_volumes
    depends_on:
      warehouse-web:
        condition: service_healthy

  gateway:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./proxy/integration.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - order-web
      - warehouse-web
    labels:
      - "luffy.entrypoint=true"
      - "luffy.port=80"

volumes:
  order_data:
    name: jiawang-commerce-order-data
  warehouse_data:
    name: jiawang-commerce-warehouse-data
  warehouse_media:
    name: jiawang-commerce-warehouse-media
