map $http_upgrade $connection_upgrade { default upgrade; '' close; }
upstream order_web { server order-web:3000; keepalive 32; }
upstream warehouse_web { server warehouse-web:3000; keepalive 32; }
server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 64g;

  location = /api/chat/image {
    client_max_body_size 6m;
    proxy_pass http://order_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /warehouse { return 308 /warehouse/; }
  location /warehouse/ {
    proxy_pass http://warehouse_web;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
  }
  location / {
    proxy_pass http://order_web;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
